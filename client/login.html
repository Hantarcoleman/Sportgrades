<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SportGrade — כניסה</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Heebo', 'Segoe UI', sans-serif;
  background: #0d0f14;
  color: #f0f2ff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* רקע עם אנימציה */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(234,88,12,.15) 0%, transparent 60%);
  pointer-events: none;
}

.login-box {
  background: #141720;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 24px 80px rgba(0,0,0,.5);
  position: relative;
}

/* לוגו */
.logo {
  text-align: center;
  margin-bottom: 32px;
}
.logo-text {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -1px;
  color: #fff;
}
.logo-text em {
  font-style: normal;
  color: #ea580c;
}
.logo-sub {
  font-size: 13px;
  color: rgba(240,242,255,.4);
  margin-top: 4px;
}

/* טאבים */
.tabs {
  display: flex;
  background: rgba(255,255,255,.05);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 28px;
}
.tab {
  flex: 1;
  padding: 9px;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: rgba(240,242,255,.4);
  transition: all .2s;
  border: none;
  background: none;
}
.tab.active {
  background: #ea580c;
  color: #fff;
}

/* שדות */
.form-group {
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: rgba(240,242,255,.5);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 6px;
}
input {
  width: 100%;
  background: #1c2030;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  color: #f0f2ff;
  font-family: inherit;
  font-size: 15px;
  padding: 12px 14px;
  transition: border-color .2s;
  outline: none;
}
input:focus {
  border-color: #ea580c;
}
input::placeholder {
  color: rgba(240,242,255,.2);
}

/* כפתורים */
.btn-primary {
  width: 100%;
  background: #ea580c;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  margin-top: 8px;
}
.btn-primary:hover {
  background: #c2410c;
  transform: translateY(-1px);
}
.btn-primary:active {
  transform: none;
}
.btn-primary:disabled {
  background: rgba(234,88,12,.4);
  cursor: not-allowed;
  transform: none;
}

/* Google */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: rgba(240,242,255,.2);
  font-size: 12px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.08);
}

.btn-google {
  width: 100%;
  background: #fff;
  color: #333;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all .2s;
}
.btn-google:hover {
  background: #f1f1f1;
  transform: translateY(-1px);
}
.btn-google svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

/* הודעות */
.msg {
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.msg.error {
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.25);
  color: #f87171;
}
.msg.success {
  background: rgba(16,185,129,.1);
  border: 1px solid rgba(16,185,129,.25);
  color: #34d399;
}
.msg.show { display: block; }

/* שכחתי סיסמה */
.forgot {
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  color: rgba(240,242,255,.3);
}
.forgot a {
  color: #ea580c;
  text-decoration: none;
  cursor: pointer;
}
.forgot a:hover { text-decoration: underline; }

/* טעינה */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-left: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* מובייל */
@media (max-width: 480px) {
  .login-box { padding: 28px 20px; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="login-box">

  <!-- לוגו -->
  <div class="logo">
    <div class="logo-text">Sport<em>Grade</em></div>
    <div class="logo-sub">מערכת הערכה בחינוך גופני</div>
  </div>

  <!-- טאבים -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">כניסה</button>
    <button class="tab" onclick="switchTab('register')">הרשמה</button>
  </div>

  <!-- הודעה -->
  <div class="msg" id="msg"></div>

  <!-- טופס כניסה -->
  <div id="form-login">
    <div class="form-group">
      <label>אימייל</label>
      <input type="email" id="login-email" placeholder="teacher@school.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>סיסמה</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-primary" id="btn-login" onclick="doLogin()">כנס</button>
    <div class="forgot"><a onclick="showForgot()">שכחתי סיסמה</a></div>
  </div>

  <!-- טופס הרשמה -->
  <div id="form-register" style="display:none;">
    <div class="form-group">
      <label>שם מלא</label>
      <input type="text" id="reg-name" placeholder="ישראל ישראלי" autocomplete="name">
    </div>
    <div class="form-group">
      <label>בית ספר</label>
      <input type="text" id="reg-school" placeholder="בית ספר על שם...">
    </div>
    <div class="form-group">
      <label>אימייל</label>
      <input type="email" id="reg-email" placeholder="teacher@school.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>סיסמה (לפחות 6 תווים)</label>
      <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()">
    </div>
    <button class="btn-primary" id="btn-register" onclick="doRegister()">צור חשבון</button>
  </div>

  <!-- Google -->
  <div class="divider">או</div>
  <button class="btn-google" onclick="doGoogle()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    כנס עם Google
  </button>

</div>

<script>
// ══════════════════════════════════════════════════════
// הגדרות Supabase — החלף בפרטים שלך
// ══════════════════════════════════════════════════════
const SUPABASE_URL = 'https://pqotkdtvccfwuephxjsk.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxb3RrZHR2Y2Nmd3VlcGh4anNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjYwNDYsImV4cCI6MjA5MjY0MjA0Nn0.mivFnmb4hqee4OvpAFZR7Yi3AKkcaQn5CNno2OtYGy8';

// ══════════════════════════════════════════════════════
// Supabase Client
// ══════════════════════════════════════════════════════
let sbClient;

function initSupabase() {
  // Use a unique name to avoid conflict with other scripts
  const sb = window.supabase || window._supabase;
  if (sb && sb.createClient) {
    sbClient = sb.createClient(SUPABASE_URL, SUPABASE_ANON);
    checkSession();
  } else {
    setTimeout(initSupabase, 100);
  }
}

window.addEventListener('load', initSupabase);

// ══════════════════════════════════════════════════════
// בדיקת session קיים — אם מחובר → עבור לאפליקציה
// ══════════════════════════════════════════════════════
async function checkSession() {
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) {
    goToApp(session.user);
  }
}

// ══════════════════════════════════════════════════════
// מעבר לאפליקציה הראשית
// ══════════════════════════════════════════════════════
function goToApp(user) {
  // שמור מידע בסיסי ב-sessionStorage
  sessionStorage.setItem('sg_user_id', user.id);
  sessionStorage.setItem('sg_user_email', user.email);
  // עבור לאפליקציה
  window.location.href = 'pe-grading-app.html';
}

// ══════════════════════════════════════════════════════
// טאבים
// ══════════════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
  hideMsg();
}

// ══════════════════════════════════════════════════════
// כניסה עם אימייל + סיסמה
// ══════════════════════════════════════════════════════
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showMsg('נא למלא אימייל וסיסמה', 'error'); return; }

  setLoading('btn-login', true);
  const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
  setLoading('btn-login', false);

  if (error) {
    showMsg(translateError(error.message), 'error');
  } else {
    goToApp(data.user);
  }
}

// ══════════════════════════════════════════════════════
// הרשמה חדשה
// ══════════════════════════════════════════════════════
async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const school = document.getElementById('reg-school').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;

  if (!name || !school || !email || !password) { showMsg('נא למלא את כל השדות', 'error'); return; }
  if (password.length < 6) { showMsg('הסיסמה חייבת להיות לפחות 6 תווים', 'error'); return; }

  // בדיקת גבול משתמשים
  const count = await getUserCount();
  if (count >= 50) {
    showMsg('המערכת מלאה כרגע. פנה למנהל.', 'error');
    return;
  }

  setLoading('btn-register', true);
  const { data, error } = await sbClient.auth.signUp({
    email,
    password,
    options: {
      data: { full_name: name, school }
    }
  });
  setLoading('btn-register', false);

  if (error) {
    showMsg(translateError(error.message), 'error');
  } else {
    // צור פרופיל
    if (data.user) {
      await sbClient.from('profiles').upsert({
        id: data.user.id,
        full_name: name,
        school,
      });
    }
    showMsg('✓ נרשמת בהצלחה! בדוק את האימייל שלך לאישור.', 'success');
    // שלח התראה לאדמין (עדכון עתידי)
    notifyAdmin(name, school, email);
  }
}

// ══════════════════════════════════════════════════════
// כניסה עם Google
// ══════════════════════════════════════════════════════
async function doGoogle() {
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin + '/pe-grading-app.html'
    }
  });
  if (error) showMsg(translateError(error.message), 'error');
}

// ══════════════════════════════════════════════════════
// שכחתי סיסמה
// ══════════════════════════════════════════════════════
async function showForgot() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) {
    showMsg('הזן את האימייל שלך בשדה למעלה', 'error');
    return;
  }
  const { error } = await sbClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password.html'
  });
  if (error) {
    showMsg(translateError(error.message), 'error');
  } else {
    showMsg('✓ נשלח אימייל לאיפוס סיסמה', 'success');
  }
}

// ══════════════════════════════════════════════════════
// עזרה
// ══════════════════════════════════════════════════════
async function getUserCount() {
  const { count } = await sbClient
    .from('profiles')
    .select('*', { count: 'exact', head: true });
  return count || 0;
}

function notifyAdmin(name, school, email) {
  // בעתיד: שליחת מייל לאדמין
  console.log('New user registered:', name, school, email);
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type + ' show';
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = 'מעבד... <span class="spinner"></span>';
  } else {
    btn.disabled = false;
    btn.innerHTML = btnId === 'btn-login' ? 'כנס' : 'צור חשבון';
  }
}

function translateError(msg) {
  const errors = {
    'Invalid login credentials': 'אימייל או סיסמה שגויים',
    'Email not confirmed': 'האימייל טרם אושר — בדוק את תיבת הדואר',
    'User already registered': 'אימייל זה כבר רשום במערכת',
    'Password should be at least 6 characters': 'הסיסמה חייבת להיות לפחות 6 תווים',
    'Unable to validate email address': 'כתובת אימייל לא תקינה',
    'Email rate limit exceeded': 'יותר מדי ניסיונות — נסה שוב בעוד מספר דקות',
  };
  return errors[msg] || 'שגיאה: ' + msg;
}
</script>
</body>
</html>
